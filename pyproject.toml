[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "synthetic-biology-promoter-designer"
version = "2.0.0"
description = "SynBio-Promoter: Thermodynamic Transcription Factor Binding & Circuit Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = ["pydantic>=2,<3"]

[project.optional-dependencies]
api = ["fastapi>=0.110,<1", "uvicorn>=0.30,<1"]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.setuptools]
packages = ["agents", "synbio_promoter"]
py-modules = ["cli", "csv_utils", "enrichment", "simulator", "synbio_promoter_app"]

[project.scripts]
synthetic-biology-promoter-designer = "synbio_promoter.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/synthetic-biology-promoter-designer"
Repository = "https://github.com/abusuraihsakhri/synthetic-biology-promoter-designer.git"
