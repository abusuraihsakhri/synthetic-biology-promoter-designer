[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "synthetic-biology-promoter-designer"
version = "2.0.0"
description = "SynBio-Promoter: Thermodynamic Transcription Factor Binding & Circuit Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
synthetic-biology-promoter-designer = "synbio_promoter.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/synthetic-biology-promoter-designer"
Repository = "https://github.com/abusuraihsakhri/synthetic-biology-promoter-designer.git"
